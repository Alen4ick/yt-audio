services:
  frontend:
    image: nginx:alpine
    container_name: yt-audio-frontend
    ports:
      - "127.0.0.1:3230:80"
    volumes:
      - "./frontend:/usr/share/nginx/html:ro"
    restart: unless-stopped

  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: yt-audio-xray
    command: ["run", "-config", "/etc/xray/config.json"]
    volumes:
      - "./xray-config.json:/etc/xray/config.json:ro"
    ports:
      - "127.0.0.1:3240:8000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.practice
    image: yt-audio:practice
    container_name: yt-audio-backend
    network_mode: "service:xray"
    depends_on:
      - xray
    environment:
      YT_PROXY: "socks5://127.0.0.1:10808"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
