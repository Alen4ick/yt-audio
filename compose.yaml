services:
  frontend:
    image: nginx:alpine
    container_name: yt-audio-frontend
    ports:
      - "127.0.0.1:3230:80"
    volumes:
      - "./frontend:/usr/share/nginx/html:ro"
    restart: unless-stopped

  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: yt-audio-xray
    command: ["run", "-config", "/etc/xray/config.json"]
    volumes:
      - "./xray-config.json:/etc/xray/config.json:ro"
    ports:
      - "127.0.0.1:3240:8000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.practice
    image: yt-audio:practice
    container_name: yt-audio-backend
    network_mode: "service:xray"
    depends_on:
      - xray
    environment:
      YT_PROXY: "socks5://127.0.0.1:10808"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  markdown:
    build:
      context: ./markdown
    image: jot:practice
    environment:
      PORT: "3000"
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3210:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - jot_data:/app/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - "./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - "./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro"
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
volumes:
  jot_data:
  prometheus_data:
  grafana_data:
