map $http_upgrade $jot_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name 185.65.200.167;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://185.65.200.167$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 185.65.200.167;

    ssl_certificate /etc/letsencrypt/live/yt-audio-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yt-audio-ip/privkey.pem;

    location = /music {
        return 301 /music/;
    }

    location /music/ {
        proxy_pass http://127.0.0.1:3230/;
        proxy_set_header Host $host;
    }

    location /music/api/ {
        proxy_pass http://127.0.0.1:3240/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jot_connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
