<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Audio</title>

  <style>
    body {
      max-width: 700px;
      margin: 60px auto;
      padding: 0 20px;
      font-family: sans-serif;
      background: #111827;
      color: #f9fafb;
    }

    form {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px;
    }

    button {
      padding: 12px 20px;
      cursor: pointer;
    }

    audio {
      width: 100%;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <h1>YouTube Audio</h1>
  <p>Вставьте ссылку на YouTube-видео.</p>

  <form id="form">
    <input
      id="url"
      type="url"
      placeholder="https://www.youtube.com/watch?v=..."
      required
    >
    <button id="button" type="submit">Слушать</button>
  </form>

  <p id="status"></p>
  <h2 id="title"></h2>
  <audio id="player" controls hidden></audio>

  <script>
    const form = document.querySelector("#form");
    const urlInput = document.querySelector("#url");
    const button = document.querySelector("#button");
    const status = document.querySelector("#status");
    const title = document.querySelector("#title");
    const player = document.querySelector("#player");

    let startedAt = 0;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      startedAt = performance.now();
      button.disabled = true;
      status.textContent = "Ищу аудиопоток...";
      title.textContent = "";
      player.hidden = true;
      player.removeAttribute("src");

      try {
        const response = await fetch("/api/resolve", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({url: urlInput.value})
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Backend вернул ошибку");
        }

        title.textContent = data.title;
        player.src = data.audio_url;
        player.hidden = false;
        player.load();

        status.textContent = "Поток найден, запускаю...";

        try {
          await player.play();
        } catch {
          status.textContent = "Поток найден — нажмите Play.";
        }
      } catch (error) {
        status.textContent = `Ошибка: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });

    player.addEventListener("playing", () => {
      const seconds = (performance.now() - startedAt) / 1000;
      status.textContent = `Воспроизведение началось за ${seconds.toFixed(1)} с.`;
    });
  </script>
</body>
</html>
